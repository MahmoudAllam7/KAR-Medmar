<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مضمار | Midmar - World Arthritis Day (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FEBD59; --ink:#1F10A3; --text:#20185E; --muted:#5B3F6E;
  --track:#E0552C; --track-2:#F07A3C; --red:#EE3B3B; --lane:#FFF3DE;
  --card:#FFD48C; --card-hover:#1F10A3; --card-hover-ink:#FEBD59;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1166; --ink:#FEBD59; --text:#FFF1D6; --muted:#E8C99A;
    --card:#271A86; --card-hover:#FEBD59; --card-hover-ink:#1A1166;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1166; --ink:#FEBD59; --text:#FFF1D6; --muted:#E8C99A;
  --card:#271A86; --card-hover:#FEBD59; --card-hover-ink:#1A1166;
}
*,*::before,*::after{box-sizing:inherit}
html{
  min-height:100%;
  height:100%;
  overflow-x:hidden;
  scroll-padding-top:env(safe-area-inset-top,0px);
}
body{
  margin:0;
  min-height:100%;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  flex-direction:column;
}
img{max-width:100%}

/* ---------- poster decorations ---------- */
.deco{position:fixed;pointer-events:none;z-index:0}
.track-tr{
  top:-12vmin;left:-18vmin;width:clamp(220px,50vmin,540px);
  transform:rotate(-8deg);opacity:0.95;
}
.track-bl{
  bottom:-14vmin;right:-18vmin;width:clamp(240px,52vmin,560px);
  transform:rotate(172deg);opacity:0.95;
}
.wave{
  top:18vh;right:-2vw;width:min(60vw,540px);
  opacity:0.25;
}
@media (max-width:600px){
  .track-tr{top:-16vmin;left:-24vmin;width:60vmin;opacity:0.75}
  .track-bl{bottom:-18vmin;right:-24vmin;width:62vmin;opacity:0.75}
  .wave{display:none}
}

/* ---------- wrap ---------- */
.wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:920px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:
    max(clamp(14px,2.2vh,28px), env(safe-area-inset-top, 0px))
    max(clamp(14px,3.2vw,36px), env(safe-area-inset-right, 0px))
    max(clamp(16px,2.6vh,32px), env(safe-area-inset-bottom, 0px))
    max(clamp(14px,3.2vw,36px), env(safe-area-inset-left, 0px));
}

/* ---------- header ---------- */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(10px,2vw,16px);
  flex-wrap:wrap;
  margin-bottom:clamp(12px,2.4vh,26px);
}
.mark{
  display:flex;
  align-items:baseline;
  gap:clamp(8px,1.5vw,12px);
  color:var(--ink);
}
.mark b{
  font-family:"Cairo",Tahoma,sans-serif;
  font-weight:700;
  font-size:clamp(1.75rem,4.5vw,2.6rem);
  line-height:1;
}
.mark span{
  font-family:"Cairo",Tahoma,sans-serif;
  font-weight:500;
  font-size:clamp(0.9rem,2.2vw,1.2rem);
  white-space:nowrap;
}
.logos{
  height:clamp(40px,6.5vw,60px);
  width:auto;
  max-width:min(48vw,260px);
  object-fit:contain;
  border-radius:10px;
  background:#FEBD59;
  padding:3px 5px;
}
.steps{
  display:flex;
  gap:clamp(4px,0.8vw,7px);
  width:100%;
}
.steps span{
  flex:1;
  height:clamp(5px,0.9vh,8px);
  border-radius:2px;
  background:color-mix(in srgb,var(--ink) 18%,transparent);
  transition:background .3s;
  transform:skewX(-24deg);
}
[dir="ltr"] .steps span{
  transform:skewX(-24deg);
}
.steps span.on{background:var(--track)}

/* ---------- main content area ---------- */
main#app{
  flex:1;
  display:flex;
  flex-direction:column;
}
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  animation:fade .25s ease both;
}

/* ---------- questions ---------- */
h1{
  font-family:"Cairo",Tahoma,sans-serif;
  font-size:clamp(1.45rem,3.6vw,2.4rem);
  font-weight:700;
  line-height:1.3;
  margin:0 0 clamp(4px,0.8vh,8px);
  color:var(--ink);
}
h1.big{
  font-size:clamp(1.75rem,4.6vw,2.9rem);
}
.lead{
  font-size:clamp(0.92rem,2vw,1.15rem);
  color:var(--muted);
  margin:0 0 clamp(10px,2vh,22px);
  line-height:1.55;
}

.options{
  display:flex;
  flex-direction:column;
  gap:clamp(8px,1.3vh,12px);
}

.opt{
  display:flex;
  align-items:center;
  gap:clamp(12px,2.2vw,18px);
  width:100%;
  text-align:start;
  font:inherit;
  color:var(--text);
  background:var(--card);
  border:clamp(2px,0.28vw,3px) solid var(--ink);
  border-start-start-radius:16px;
  border-end-start-radius:16px;
  border-start-end-radius:999px;
  border-end-end-radius:999px;
  padding:clamp(9px,1.3vh,15px) clamp(12px,2vw,20px);
  cursor:pointer;
  box-shadow:clamp(4px,0.5vw,6px) clamp(4px,0.5vw,6px) 0 var(--track);
  transition:background .15s,color .15s,transform .1s,box-shadow .1s;
  min-height:46px;
}
.opt:hover{background:var(--card-hover);color:var(--card-hover-ink)}
.opt:hover .d{color:inherit;opacity:.85}
.opt:active{
  transform:translate(clamp(2px,0.3vw,3px),clamp(2px,0.3vw,3px));
  box-shadow:clamp(1px,0.2vw,2px) clamp(1px,0.2vw,2px) 0 var(--track);
}
.opt:focus-visible,.btn:focus-visible,.link button:focus-visible{
  outline:3px solid var(--red);
  outline-offset:3px;
}
.opt .ic{
  flex:none;
  width:clamp(40px,5vw,52px);
  height:clamp(40px,5vw,52px);
  border-radius:50%;
  background:var(--track);
  display:grid;
  place-items:center;
  color:var(--lane);
  border:clamp(2px,0.28vw,3px) solid var(--lane);
}
.opt .ic svg{
  width:clamp(20px,2.6vw,26px);
  height:clamp(20px,2.6vw,26px);
}
.opt .t{
  font-size:clamp(1rem,2.2vw,1.35rem);
  font-weight:600;
  line-height:1.35;
}
.opt .d{
  display:block;
  font-size:clamp(.82rem,1.7vw,.95rem);
  color:var(--muted);
  font-weight:400;
  margin-top:2px;
  line-height:1.35;
}

.nav{
  display:flex;
  gap:clamp(8px,1.4vw,12px);
  margin-top:clamp(14px,2.4vh,26px);
  flex-wrap:wrap;
}
.btn{
  font:inherit;
  font-size:clamp(.95rem,2vw,1.1rem);
  font-weight:600;
  padding:clamp(8px,1.1vh,12px) clamp(18px,2.8vw,26px);
  border-radius:999px;
  cursor:pointer;
  border:clamp(2px,0.28vw,3px) solid var(--ink);
  background:transparent;
  color:var(--ink);
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:all .15s ease;
}
.btn:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,black)}

.link{
  margin-top:auto;
  padding-top:clamp(12px,2vh,22px);
  text-align:center;
}
.link button{
  font:inherit;
  font-weight:600;
  background:none;
  border:none;
  color:var(--ink);
  font-size:clamp(.92rem,2vw,1.05rem);
  cursor:pointer;
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:6px;
  padding:6px 10px;
  min-height:42px;
}
.link button:hover{color:var(--track)}

/* ---------- language screen ---------- */
.langscreen{
  text-align:center;
  padding-top:clamp(8px,3vh,40px);
  margin:auto 0;
}
.langscreen h1{margin:0}
.langscreen h1.en{margin:4px 0 clamp(16px,3vh,36px)}
.langscreen .options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));
  gap:clamp(10px,2.2vw,20px);
  max-width:580px;
  margin:0 auto;
  width:100%;
}
.langscreen .opt{
  flex-direction:column;
  justify-content:center;
  gap:clamp(8px,1.4vh,12px);
  text-align:center;
  border-radius:24px;
  padding:clamp(16px,2.6vh,30px) clamp(12px,2vw,20px);
  min-height:clamp(100px,15vh,150px);
}
.langscreen .opt .ic{
  width:clamp(48px,6.5vw,64px);
  height:clamp(48px,6.5vw,64px);
  margin:0 auto;
}
.langscreen .opt .ic svg{
  width:clamp(26px,3.4vw,32px);
  height:clamp(26px,3.4vw,32px);
}
.langscreen .opt .t{
  font-size:clamp(1.3rem,3vw,1.85rem);
  font-weight:700;
}
.info{
  margin:10px 0 0;
  color:var(--muted);
  font-size:clamp(.84rem,1.7vw,.96rem);
  line-height:1.6;
}

/* ---------- result ---------- */
.result{
  text-align:center;
  margin:auto 0;
}
.result .go{
  font-family:"Cairo",Tahoma,sans-serif;
  font-size:clamp(1.15rem,2.6vw,1.6rem);
  color:var(--ink);
  margin:0;
  font-weight:600;
}
.numwrap{
  position:relative;
  margin:clamp(4px,1vh,10px) 0 clamp(6px,1.2vh,12px);
  padding:clamp(4px,0.8vh,10px) 0;
  overflow:hidden;
}
.stripes{
  position:absolute;
  inset:18% -15%;
  transform:skewY(-8deg);
  background:
   radial-gradient(circle,var(--track-2) 1.6px,transparent 2px) 0 0/9px 9px,
   linear-gradient(var(--track),var(--track)) 0 22%/100% 18% no-repeat,
   linear-gradient(var(--track-2),var(--track-2)) 0 58%/78% 14% no-repeat,
   linear-gradient(var(--red),var(--red)) 100% 84%/60% 9% no-repeat;
  opacity:.85;
  -webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);
  mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);
}
.result .num{
  position:relative;
  font-family:"Cairo",Tahoma,sans-serif;
  font-size:clamp(6.5rem,20vmin,13.5rem);
  font-weight:700;
  line-height:0.95;
  color:var(--ink);
  text-shadow:clamp(3px,0.8vw,6px) clamp(3px,0.8vw,6px) 0 var(--bg);
  animation:dash .5s cubic-bezier(.15,.9,.3,1.1) both;
}
.result .num small{
  display:block;
  font-size:clamp(1.05rem,2.4vw,1.45rem);
  font-weight:700;
  color:var(--text);
  margin-bottom:0;
  text-shadow:none;
  line-height:1.2;
}
@keyframes dash{
  from{transform:translateX(min(28vw,100px)) skewX(-12deg);opacity:0}
  70%{transform:translateX(-6px) skewX(4deg);opacity:1}
  to{transform:none}
}
.result .org{
  font-size:clamp(1.2rem,2.8vw,1.8rem);
  font-weight:700;
  margin:0 0 2px;
  color:var(--ink);
  line-height:1.3;
}
.result .topic{
  font-size:clamp(0.92rem,2vw,1.15rem);
  color:var(--muted);
  margin:0 0 clamp(10px,1.8vh,20px);
  line-height:1.4;
}
.also{
  background:var(--card);
  border:clamp(2px,0.28vw,3px) dashed var(--ink);
  border-radius:18px;
  padding:clamp(10px,1.4vh,15px) clamp(14px,2.2vw,20px);
  text-align:start;
  max-width:540px;
  margin:0 auto clamp(6px,1vh,10px);
}
.also h3{
  margin:0 0 3px;
  font-size:clamp(.88rem,1.8vw,.98rem);
  font-weight:600;
  color:var(--muted);
}
.also p{
  margin:2px 0;
  font-size:clamp(.92rem,2vw,1.02rem);
  line-height:1.4;
}
.also b{
  color:var(--track);
  font-family:"Cairo",Tahoma,sans-serif;
  font-size:clamp(1.05rem,2.2vw,1.25rem);
}
.result .nav{justify-content:center}
.timer{
  font-size:clamp(.82rem,1.6vw,.92rem);
  color:var(--muted);
  margin-top:clamp(8px,1.5vh,14px);
}

/* ---------- directory ---------- */
.dir-wrap{
  overflow-x:auto;
  border:clamp(2px,0.28vw,3px) solid var(--ink);
  border-radius:18px;
  background:var(--card);
  box-shadow:4px 4px 0 var(--track);
  -webkit-overflow-scrolling:touch;
}
.dir{
  width:100%;
  border-collapse:collapse;
  min-width:280px;
}
.dir th,.dir td{
  padding:clamp(8px,1.1vh,12px) clamp(10px,1.8vw,16px);
  text-align:start;
  border-bottom:2px solid color-mix(in srgb,var(--ink) 15%,transparent);
  vertical-align:middle;
}
.dir tr:last-child td{border-bottom:none}
.dir tr:hover td{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.dir th{
  font-weight:600;
  color:var(--bg);
  background:var(--ink);
  font-size:clamp(.86rem,1.8vw,.98rem);
  position:sticky;
  top:0;
  z-index:2;
}
.dir td.n{
  font-family:"Cairo",Tahoma,sans-serif;
  font-weight:700;
  font-size:clamp(1.3rem,2.6vw,1.65rem);
  color:var(--track);
  width:clamp(48px,10vw,72px);
  text-align:center;
}
.dir td .o{
  font-weight:600;
  color:var(--ink);
  font-size:clamp(.92rem,2vw,1.05rem);
}
.dir td .s{
  color:var(--muted);
  font-size:clamp(.82rem,1.7vw,.95rem);
  margin-top:2px;
}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen,.result .num{animation:none}
}

/* Mobile small adjustments */
@media (max-width:480px){
  .wrap{
    padding-left:14px;
    padding-right:14px;
  }
  .langscreen .options{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
}

/* Very short height screens (landscape phones or compact displays) */
@media (max-height:680px){
  header{margin-bottom:8px}
  .mark b{font-size:1.5rem}
  .logos{height:36px}
  h1{font-size:1.35rem;margin-bottom:2px}
  .lead{margin-bottom:6px;font-size:0.88rem}
  .options{gap:6px}
  .opt{padding:7px 12px}
  .opt .ic{width:36px;height:36px}
  .opt .ic svg{width:18px;height:18px}
  .nav{margin-top:8px}
  .link{padding-top:6px}
  .result .num{font-size:clamp(4.5rem,15vmin,7.5rem)}
}

@media (max-height: 820px){
  .wrap{
    padding-top: clamp(10px, 1.6vh, 20px);
    padding-bottom: clamp(12px, 1.8vh, 20px);
  }
  header{
    margin-bottom: clamp(8px, 1.6vh, 16px);
  }
  h1{
    font-size: clamp(1.35rem, 2.8vw, 1.95rem);
    margin-bottom: 3px;
  }
  .lead{
    margin-bottom: clamp(8px, 1.4vh, 14px);
    font-size: clamp(0.88rem, 1.6vw, 1.05rem);
  }
  .options{
    gap: clamp(6px, 1vh, 9px);
  }
  .opt{
    padding: clamp(7px, 1vh, 11px) clamp(12px, 1.6vw, 18px);
    min-height: 42px;
  }
  .opt .ic{
    width: 38px;
    height: 38px;
  }
  .opt .ic svg{
    width: 20px;
    height: 20px;
  }
  .nav{
    margin-top: clamp(10px, 1.6vh, 18px);
  }
  .btn{
    padding: clamp(6px, 0.9vh, 10px) clamp(16px, 2.4vw, 22px);
    min-height: 40px;
  }
  .link{
    padding-top: clamp(8px, 1.4vh, 14px);
  }
  .link button{
    padding: 4px 8px;
    min-height: 36px;
  }
}

</style>
</head>
<body>
<!-- racetrack corners (from the poster) -->
<svg class="deco track-tr" viewBox="0 0 400 260" aria-hidden="true">
  <ellipse cx="200" cy="130" rx="170" ry="100" fill="none" stroke="var(--track)" stroke-width="58"/>
  <ellipse cx="200" cy="130" rx="190" ry="120" fill="none" stroke="#B8401F" stroke-width="10"/>
  <g fill="none" stroke="var(--lane)" stroke-width="2">
    <ellipse cx="200" cy="130" rx="143" ry="73"/><ellipse cx="200" cy="130" rx="154" ry="84"/>
    <ellipse cx="200" cy="130" rx="165" ry="95"/><ellipse cx="200" cy="130" rx="176" ry="106"/>
    <ellipse cx="200" cy="130" rx="187" ry="117"/>
  </g>
  <ellipse cx="200" cy="130" rx="138" ry="68" fill="none" stroke="var(--lane)" stroke-width="4"/>
</svg>
<svg class="deco track-bl" viewBox="0 0 400 260" aria-hidden="true">
  <ellipse cx="200" cy="130" rx="170" ry="100" fill="none" stroke="var(--track)" stroke-width="58"/>
  <ellipse cx="200" cy="130" rx="190" ry="120" fill="none" stroke="#B8401F" stroke-width="10"/>
  <g fill="none" stroke="var(--lane)" stroke-width="2">
    <ellipse cx="200" cy="130" rx="143" ry="73"/><ellipse cx="200" cy="130" rx="154" ry="84"/>
    <ellipse cx="200" cy="130" rx="165" ry="95"/><ellipse cx="200" cy="130" rx="176" ry="106"/>
    <ellipse cx="200" cy="130" rx="187" ry="117"/>
  </g>
  <ellipse cx="200" cy="130" rx="138" ry="68" fill="none" stroke="var(--lane)" stroke-width="4"/>
</svg>
<!-- the red/blue running line -->
<svg class="deco wave" viewBox="0 0 600 500" aria-hidden="true" style="opacity:.35">
  <path d="M590 40 C470 -10 430 120 380 160 S250 90 200 200 S310 380 210 430 S60 360 10 470" fill="none" stroke="var(--red)" stroke-width="9" stroke-linecap="round" transform="translate(5 5)"/>
  <path d="M590 40 C470 -10 430 120 380 160 S250 90 200 200 S310 380 210 430 S60 360 10 470" fill="none" stroke="#1F10A3" stroke-width="7" stroke-linecap="round"/>
</svg>

<div class="wrap">

      {ic:"tube", t:["فحص الكالسيوم وفيتامين د","Calcium and vitamin D testing"], booth:"lab"},
      {ic:"nosmoke", t:["التدخين وأثره على العظام","How smoking affects your bones"], booth:"chest"},
      {ic:"salt", t:["الأملاح والنقرس","Uric acid and gout"], booth:"internal"},
    ]},
  elder:{q:["ما الذي يقلقك بشأنه؟","What concerns you about them?"], options:[
      {ic:"warn", t:["السقوط أو الخوف من السقوط","Falls, or fear of falling"], d:["أو كسر حدث بعد سقوط","Or a fracture after a fall"], booth:"geri"},
      {ic:"bone", t:["هشاشة العظام","Osteoporosis"], booth:"osteo"},
      {ic:"joint", t:["ألم أو تيبس في المفاصل","Joint pain or stiffness"], next:"joints"},
      {ic:"pill", t:["الأدوية والمسكنات","Medicines and painkillers"], d:["المسكنات والأدوية البيولوجية","Painkillers and biologic medicines"], booth:"pharmacy"},
    ]},
  child:{q:["ما الذي يعاني منه الطفل؟","What is the child experiencing?"], options:[
      {ic:"joint", t:["ألم أو تورم أو تيبس في المفاصل","Joint pain, swelling or stiffness"], booth:"peds_rheum"},
      {ic:"activity", t:["كسر أو إصابة رياضية","A fracture or sports injury"], next:"region"},
    ]},
};

const ALSO = {
  ortho_upper:["pm_physio"], ortho_lower:["pm_physio"],
  rheum:["lab","pharmacy"], derm:["rheum","pharmacy"], internal:["lab"],
  osteo:["lab","geri"], geri:["osteo"], chest:["osteo"],
  lab:["osteo"], peds_rheum:["pharmacy"], pm_physmed:["pm_physio"],
  pm_physio:["pm_ot"], pm_ot:["pm_physio"], pharmacy:[], moh:[],
};

const ICONS = {
  user:'<circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',
  elder:'<circle cx="10" cy="4.5" r="2.5"/><path d="M10 8v6l-3 7M10 14l3 7M7 11.5l3-2.5 3 2.5M17 13v8M17 13a2 2 0 0 0-2-2"/>',
  child:'<circle cx="12" cy="6" r="3"/><path d="M8.5 21l1-7h5l1 7M7 11.5 12 10l5 1.5"/>',
  hospital:'<path d="M3 21h18M5 21V7l7-4 7 4v14M12 8v6M9 11h6M10 21v-3h4v3"/>',
  bone:'<path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/>',
  joint:'<path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  upper:'<circle cx="12" cy="4" r="2"/><path d="M12 6v8M6 9.5 12 8l6 1.5M6 9.5 4.5 16M18 9.5l1.5 6.5"/><path d="M10 14l-1 7M14 14l1 7" opacity=".35"/>',
  lower:'<circle cx="12" cy="4" r="2" opacity=".35"/><path d="M6 9.5 12 8l6 1.5" opacity=".35"/><path d="M12 6v8M9 14h6M10 14l-1 7M14 14l1 7"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  skin:'<path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
  sunrise:'<path d="M12 2v6M4.9 10.9l1.4 1.4M2 18h2M20 18h2M19.1 10.9l-1.4 1.4M22 22H2M9 5l3-3 3 3M16 18a4 4 0 0 0-8 0"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  steth:'<path d="M5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 12 0V4a2 2 0 0 0-2-2h-1"/><path d="M8 15v1a6 6 0 0 0 12 0v-4"/><circle cx="20" cy="10" r="2"/>',
  dumbbell:'<path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/>',
  brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/>',
  tube:'<path d="M14.5 2v17.5a2.5 2.5 0 0 1-5 0V2M8.5 2h7M14.5 15h-5"/>',
  nosmoke:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2M6 13h7M16 13h2"/>',
  salt:'<path d="M8 9h8l-1 12H9L8 9zM8.5 9a3.5 3.5 0 0 1 7 0"/><path d="M11 6h.01M13 6h.01M12 4.5h.01"/>',
  warn:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||""}</svg>`;

/* ========================================================= */
const app = document.getElementById("app");
const stepsEl = document.getElementById("steps");
let lang = "ar", history = [], timer = null, tick = null;
const L = () => (lang==="ar"?0:1);
const T = () => TXT[lang];
const B = id => { const b=BOOTHS[id]; return {n:b.n, org:b[lang][0], topic:b[lang][1]}; };

function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir = l==="ar"?"rtl":"ltr";
  document.getElementById("markB").textContent=T().mark;
  document.getElementById("markS").textContent=T().tag;
}
function setSteps(n, total=3){
  stepsEl.innerHTML="";
  for(let i=0;i<total;i++){const s=document.createElement("span"); if(i<n) s.className="on"; stepsEl.appendChild(s);}
}
function clearTimers(){clearTimeout(timer);clearInterval(tick);timer=null;tick=null}

function renderLang(){
  clearTimers(); history=[];
  setLang("ar");
  stepsEl.style.visibility="hidden";
  app.innerHTML = `
  <section class="screen langscreen">
    <h1 class="big">اختر اللغة</h1>
    <h1 class="big en" dir="ltr">Choose your language</h1>
    <div class="options">
      <button class="opt" type="button" data-l="ar"><span class="ic" aria-hidden="true">${icon("globe")}</span><span class="t">العربية</span></button>
      <button class="opt" type="button" data-l="en" dir="ltr"><span class="ic" aria-hidden="true">${icon("globe")}</span><span class="t">English</span></button>
    </div>
    <div class="link"><p class="info">${TXT.ar.info}<br>${TXT.ar.org}</p><p class="info" dir="ltr">${TXT.en.info}<br>${TXT.en.org}</p></div>
  </section>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{setLang(b.dataset.l); renderQuestion("start");});
  window.scrollTo(0,0);
}

function renderQuestion(key){
  clearTimers();
  stepsEl.style.visibility="visible";
  const node=TREE[key], i=L();
  setSteps(Math.min(history.length+1,3));
  app.innerHTML="";
  const s=document.createElement("section"); s.className="screen";
  s.innerHTML=`<h1 class="${key==="start"?"big":""}">${node.q[i]}</h1><p class="lead">${node.sub?node.sub[i]:T().pick}</p>`;
  const list=document.createElement("div"); list.className="options";
  node.options.forEach(o=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML=`<span class="ic" aria-hidden="true">${icon(o.ic)}</span><span class="t">${o.t[i]}${o.d?`<span class="d">${o.d[i]}</span>`:""}</span>`;
    b.onclick=()=>{history.push(key); if(o.booth) renderResult(o.booth); else renderQuestion(o.next);};
    list.appendChild(b);
  });
  s.appendChild(list);
  const nav=document.createElement("div"); nav.className="nav";
  nav.innerHTML = key==="start"
    ? `<button class="btn" type="button" id="langbtn">${T().lang}</button>`
    : `<button class="btn" type="button" id="back">${T().back}</button><button class="btn" type="button" id="home">${T().home}</button>`;
  s.appendChild(nav);
  if(key==="start"){
    const l=document.createElement("div"); l.className="link";
    l.innerHTML=`<button type="button" id="all">${T().all}</button><p class="info">${T().info}<br>${T().org}</p>`;
    s.appendChild(l);
  }
  app.appendChild(s);
  bindNav();
  armIdle();
}

function renderResult(id){
  clearTimers();
  const b=B(id);
  setSteps(3);
  const also=(ALSO[id]||[]).map(B);
  app.innerHTML=`
  <section class="screen result">
    <p class="go">${T().go}</p>
    <div class="numwrap"><div class="stripes" aria-hidden="true"></div><div class="num"><small>${T().boothNo}</small>${b.n}</div></div>
    <p class="org">${b.org}</p>
    <p class="topic">${b.topic}</p>
    ${also.length?`<div class="also"><h3>${T().also}</h3>${also.map(a=>`<p>${T().booth} <b>${a.n}</b>: ${a.org} (${a.topic})</p>`).join("")}</div>`:""}
    <div class="nav">
      <button class="btn primary" type="button" id="home">${T().restart}</button>
      <button class="btn" type="button" id="back">${T().back}</button>
    </div>
    <p class="timer" id="cd"></p>
  </section>`;
  bindNav();
  let left=RESET_SECONDS; const cd=document.getElementById("cd");
  const upd=()=>{cd.textContent=T().countdown(left)}; upd();
  tick=setInterval(()=>{left--; if(left<=0) renderLang(); else upd();},1000);
}

function renderAll(){
  clearTimers();
  setSteps(0);
  const rows=Object.keys(BOOTHS).map(B).sort((a,b)=>a.n-b.n)
    .map(b=>`<tr><td class="n">${b.n}</td><td><div class="o">${b.org}</div><div class="s">${b.topic}</div></td></tr>`).join("");
  app.innerHTML=`
  <section class="screen">
    <h1>${T().allTitle}</h1>
    <p class="lead">${T().allSub}</p>
    <div class="dir-wrap"><table class="dir"><thead><tr><th>${T().colBooth}</th><th>${T().colOrg}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="nav"><button class="btn primary" type="button" id="home">${T().backHome}</button></div>
  </section>`;
  bindNav();
  armIdle();
}

function bindNav(){
  const back=document.getElementById("back"), home=document.getElementById("home"),
        all=document.getElementById("all"), lb=document.getElementById("langbtn");
  if(back) back.onclick=()=>{const prev=history.pop(); renderQuestion(prev||"start")};
  if(home) home.onclick=renderLang;
  if(all) all.onclick=renderAll;
  if(lb) lb.onclick=()=>{setLang(lang==="ar"?"en":"ar"); renderQuestion("start")};
  window.scrollTo(0,0);
}

/* العودة لشاشة اختيار اللغة عند ترك الشاشة دون استخدام */
function armIdle(){clearTimeout(timer);timer=setTimeout(renderLang,(RESET_SECONDS+30)*1000)}
["pointerdown","keydown"].forEach(e=>document.addEventListener(e,()=>{if(!tick && !document.querySelector(".langscreen")) armIdle();},{passive:true}));

renderLang();
</script>
</body>
</html>
